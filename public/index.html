<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer-when-downgrade" />
    <title>Arrecife</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://accounts.google.com/gsi/client" async></script>
  </head>
  <body>
    <section id="pantalla-acceso" class="panel">
      <div class="tarjeta">
        <p class="materia">Graficas computacionales web</p>
        <h1>Arrecife</h1>
        <p class="bajada">Entra con Google.</p>
        <div id="boton-google"></div>
        <p id="aviso-config" class="hidden"></p>
        <p id="error"></p>
      </div>
    </section>

    <div id="hud" class="hidden">
      <p id="nombre-hud"></p>
      <p id="tiempo-hud">Tiempo: 1:00</p>
      <p id="puntos-hud">Puntos: $0</p>
      <p id="ultimo-hud"></p>
      <p id="mira">+</p>
      <p id="ayuda">WASD nadar · mouse mirar · clic arpon</p>
      <button id="btn-salir-hud" type="button">Cerrar sesión</button>
    </div>
    <button id="velo" class="hidden" type="button">Clic para nadar</button>

    <section id="pantalla-fin" class="panel hidden">
      <div class="tarjeta">
        <p class="materia">Se acabo el tiempo</p>
        <h1 id="puntos-fin">$0</h1>
        <p id="detalle-fin"></p>
        <button id="btn-otra" type="button">Otra vez</button>
        <button id="btn-salir-fin" type="button">Cerrar sesión</button>
      </div>
    </section>

    <section id="pantalla-bienvenida" class="panel hidden">
      <div class="tarjeta">
        <p class="materia">Graficas computacionales web</p>
        <h1>Arrecife</h1>
        <img id="foto-perfil" alt="Foto de perfil" />
        <p id="nombre-perfil"></p>
        <p id="correo-perfil"></p>
        <p id="estado-modelos">Cargando modelos...</p>
        <p class="bajada">60 segundos. Clic dispara el arpon: si pesca, el pez vuelve.</p>
        <button id="btn-bucear" type="button" disabled>Bucear</button>
        <button id="btn-salir" type="button">Cerrar sesión</button>
      </div>
    </section>

    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three.module.js"
        }
      }
    </script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
